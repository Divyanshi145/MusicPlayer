<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <title>Music Player | devChallenges.io</title>

  <!--You are welcome to delete these styles or modify them in your own stylesheet -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-image: url("resources/gradient-bg.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Inter", sans-serif;
    }

    .music-card {
      width: 350px;
      height: 510px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #212936;
      padding: 16px;


    }

    .cover1 img {
      border-radius: 16px;
    }

    .title {
      color: #E5E7EB;
      margin-top: 15px;
      margin-bottom: 6px;
      font-size: 16px;
    }

    .author {
      color: #8193bda6;
      font-size: 12px;
    }

    .progress-container {
      width: 100%;
      margin-top: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background-color: #E5E7EB;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }

    .progress-filled {
      width: 0%;
      height: 100%;
      background-color: #C93B76;
      border-radius: 10px;
      position: relative;
      box-shadow:  0px 0px 10px rgba(201, 59, 118, 0.35);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      color: #8193bda6;
      ;
    }
    .controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-top: 20px;
}

.control-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.control-btn img {
  width: 32px;
  height: 32px;
}

.play-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background-color: #C93B76;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  filter: drop-shadow(0px 8px 16px rgba(201, 59, 118, 0.25));
}

.play-btn img {
  width: 40px;
  height: 40px;
}
  </style>
</head>

<body>
  <div class="music-card">
    <audio id="audio1" src="resources/lost-in-city-lights-145038.mp3"></audio>
    <div class="cover1">
      <img id="cover" src="resources/cover-1.jpg" alt="">
    </div>

    <p class="title" id="title">Lost in the City Lights</p>
    <p class="author" id="author">Cosmo Sheldrake</p>
    <div class="progress-container">
       <div class="time-labels">
        <span class="current-time">00:00</span>
        <span class="total-time"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-filled"></div>
      </div>
     
    </div>
    <div class="controls">
  <button id="prevButton" class="control-btn">
    <img src="resources/reverse.svg" alt="previous">
  </button>

  <button id="playButton" class="play-btn">
    <img id="playIcon" src="resources/play.svg" alt="play">
  </button>

  <button id="nextButton" class="control-btn">
    <img src="resources/next.svg" alt="next">
  </button>
</div>


  </div>
 <script src="./Musicscript.js"></script>


</body>

</html>
